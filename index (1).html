<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A5B">
<title>ALHAKIM SERVICES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: colonne mobile unique (max 680px), en-tête bleu, cartes blanches, navigation fixe en bas. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#0B1B36; --muted:#4F5E78; --line:#D9E1EE;
  --primary:#0B2A5B; --on-primary:#FFFFFF; --link:#0B2A5B; --soft:#E5EDFA;
  --hero:#0B2A5B; --hero-ink:#FFFFFF; --hero-muted:#BFD0EE;
  --wa:#12813B; --on-wa:#FFFFFF;
  --demo-bg:#FFF1C9; --demo-ink:#5A4100;
  --danger:#B3261E; --ok-bg:#DFF3E6; --ok-ink:#0E5A2A;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#111D32; --ink:#E9EFFA; --muted:#A3B1C9; --line:#243350;
  --primary:#2F63D1; --on-primary:#FFFFFF; --link:#9DBBFF; --soft:#192A4A;
  --hero:#0E2350; --hero-ink:#FFFFFF; --hero-muted:#B3C4E6;
  --wa:#1A9A4A; --on-wa:#FFFFFF;
  --demo-bg:#3A2E0A; --demo-ink:#FFDF8A;
  --danger:#FF8A80; --ok-bg:#12352A; --ok-ink:#9EE6B8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#111D32; --ink:#E9EFFA; --muted:#A3B1C9; --line:#243350;
  --primary:#2F63D1; --on-primary:#FFFFFF; --link:#9DBBFF; --soft:#192A4A;
  --hero:#0E2350; --hero-ink:#FFFFFF; --hero-muted:#B3C4E6;
  --wa:#1A9A4A; --on-wa:#FFFFFF;
  --demo-bg:#3A2E0A; --demo-ink:#FFDF8A;
  --danger:#FF8A80; --ok-bg:#12352A; --ok-ink:#9EE6B8;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 96px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--link)}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label-up{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* En-tête */
.top{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;flex:none}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em;color:var(--ink)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px 16px 18px;display:flex;flex-direction:column;gap:14px}
.hero h1{color:var(--hero-ink)}
.hero p.sub{color:var(--hero-muted)}
.hero .brand{color:var(--hero-ink)}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-weight:600;font-size:.9rem}
.opt{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],input[type=tel],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
select:disabled{opacity:.6}
[aria-invalid=true]{border-color:var(--danger)}
.err{color:var(--danger);font-size:.85rem;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--primary)}
.hero input,.hero select{border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:0;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-wa{background:var(--wa);color:var(--on-wa)}
.btn-ghost{background:transparent;color:var(--link);border:1.5px solid var(--line)}
.btn-light{background:#fff;color:#0B2A5B}
.btn-block{width:100%}

/* Catégories */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:96px}
.cat .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--link)}
.cat span.t{font-weight:600;font-size:.95rem;line-height:1.25}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Cartes professionnels */
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.card{display:flex;gap:12px;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:16px;text-decoration:none;color:var(--ink);align-items:flex-start}
.card .av{width:56px;height:56px;border-radius:14px;background:var(--soft);color:var(--link);display:grid;place-items:center;flex:none;overflow:hidden}
.card .av svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.card .nm{font-weight:700;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--link);font-weight:600}
.demo{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--demo-bg);color:var(--demo-ink);letter-spacing:.03em;text-transform:uppercase;align-self:flex-start}
.notice{padding:12px 14px;border-radius:14px;background:var(--demo-bg);color:var(--demo-ink);font-size:.9rem}
.ok{padding:14px;border-radius:14px;background:var(--ok-bg);color:var(--ok-ink)}
.empty{padding:24px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* Profil */
.pf-head{display:flex;gap:14px;align-items:center}
.pf-av{width:84px;height:84px;border-radius:20px;background:var(--soft);color:var(--link);display:grid;place-items:center;flex:none;overflow:hidden}
.pf-av svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pf-av img,.card .av img{width:100%;height:100%;object-fit:cover}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.dl dt{color:var(--muted);font-size:.85rem}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.numbox{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.numbox b{font-size:1.1rem;font-variant-numeric:tabular-nums;user-select:all}
.back{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:600;min-height:44px}
.preview{width:96px;height:96px;border-radius:16px;object-fit:cover;border:1px solid var(--line)}

/* Navigation basse */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bar .in{width:100%;max-width:680px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.bar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600}
nav.bar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bar a[aria-current=page]{color:var(--link);background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#0B1B36;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (max-width:360px){.row2{grid-template-columns:1fr}h1{font-size:1.5rem}}
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>

</head>
<body>
<div class="wrap">
  <main id="view" class="view" tabindex="-1" style="display:flex;flex-direction:column;gap:20px;outline:none"></main>
</div>
<nav class="bar" aria-label="Navigation principale"><div class="in" id="nav"></div></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ---------- Données ---------- */
/* Structure prête pour une base de données : chaque profil = un objet avec les champs ci-dessous.
   Pour brancher une base plus tard, remplacer DEMO par le résultat d'une requête (même format). */
var CATS=[
 {id:'tel',label:'Réparation de téléphones',ico:'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>'},
 {id:'elec',label:'Électricité',ico:'<path d="M13 2 5 14h6l-1 8 8-12h-6z"/>'},
 {id:'plomb',label:'Plomberie',ico:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'},
 {id:'meca',label:'Mécanique automobile',ico:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>'},
 {id:'couture',label:'Couture',ico:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>'},
 {id:'menu',label:'Menuiserie',ico:'<path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2m1-5 2 2m1-5 2 2"/>'},
 {id:'coiff',label:'Coiffure et beauté',ico:'<path d="m12 3 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>'},
 {id:'maco',label:'Maçonnerie et travaux',ico:'<rect x="3" y="4" width="18" height="16"/><path d="M3 10h18M3 15h18M9 4v6M15 10v5M9 15v5"/>'},
 {id:'info',label:'Informatique',ico:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>'},
 {id:'net',label:'Nettoyage et entretien',ico:'<path d="M12 3v8M8 11h8l1 10H7z"/>'}
];
var PLACES={"N'Djaména":["Chagoua","Farcha","Moursal","Walia","Diguel","Amriguébé","Ambatta","Dembé"],"Moundou":["Doumbeur","Centre-ville"],"Abéché":["Centre-ville"],"Sarh":["Centre-ville"]};
var DEMO=[
 {id:'d1',name:'Atelier Téléphone (exemple)',cat:'tel',spec:['Écrans','Batteries','Logiciel'],desc:'Exemple de profil : réparation d\'écrans, remplacement de batteries et dépannage logiciel pour smartphones Android.',city:"N'Djaména",quartier:'Chagoua',phone:'00000001',hours:'Lun–Sam · 8 h – 19 h',price:'Remplacement d\'écran dès 15 000 FCFA',popular:true},
 {id:'d2',name:'Électricité Bâtiment (exemple)',cat:'elec',spec:['Installation','Dépannage','Tableaux'],desc:'Exemple de profil : installation et dépannage électrique pour maisons et boutiques, mise en place de prises et d\'éclairage.',city:"N'Djaména",quartier:'Farcha',phone:'00000002',hours:'Lun–Sam · 7 h – 18 h',price:'',popular:true},
 {id:'d3',name:'Plomberie Service (exemple)',cat:'plomb',spec:['Fuites','Sanitaires','Pompes'],desc:'Exemple de profil : recherche de fuites, pose de sanitaires et entretien de pompes à eau.',city:'Moundou',quartier:'Doumbeur',phone:'00000003',hours:'',price:'Déplacement dès 5 000 FCFA',popular:false},
 {id:'d4',name:'Garage Mécanique (exemple)',cat:'meca',spec:['Vidange','Freins','Diagnostic'],desc:'Exemple de profil : entretien courant, freins, suspension et diagnostic pour voitures et motos.',city:"N'Djaména",quartier:'Walia',phone:'00000004',hours:'Lun–Sam · 7 h 30 – 18 h',price:'',popular:true},
 {id:'d5',name:'Couture Élégance (exemple)',cat:'couture',spec:['Sur mesure','Retouches','Tenues de fête'],desc:'Exemple de profil : confection sur mesure, retouches et tenues pour cérémonies.',city:"N'Djaména",quartier:'Moursal',phone:'00000005',hours:'Lun–Sam · 8 h – 17 h',price:'',popular:false},
 {id:'d6',name:'Menuiserie du Centre (exemple)',cat:'menu',spec:['Portes','Meubles','Fenêtres'],desc:'Exemple de profil : fabrication de portes, fenêtres et meubles en bois sur commande.',city:'Abéché',quartier:'Centre-ville',phone:'00000006',hours:'',price:'',popular:false},
 {id:'d7',name:'Salon Beauté (exemple)',cat:'coiff',spec:['Tresses','Coupe','Soins'],desc:'Exemple de profil : coiffure, tresses et soins, sur rendez-vous.',city:"N'Djaména",quartier:'Diguel',phone:'00000007',hours:'Mar–Dim · 9 h – 19 h',price:'Tresses dès 3 000 FCFA',popular:true},
 {id:'d8',name:'Travaux & Maçonnerie (exemple)',cat:'maco',spec:['Construction','Carrelage','Rénovation'],desc:'Exemple de profil : petits et moyens travaux de maçonnerie, carrelage et rénovation.',city:'Sarh',quartier:'Centre-ville',phone:'00000008',hours:'',price:'',popular:false},
 {id:'d9',name:'Dépannage Informatique (exemple)',cat:'info',spec:['Ordinateurs','Réseau','Imprimantes'],desc:'Exemple de profil : dépannage d\'ordinateurs, installation de logiciels et configuration Wi-Fi.',city:"N'Djaména",quartier:'Amriguébé',phone:'00000009',hours:'Lun–Ven · 8 h – 17 h',price:'',popular:true},
 {id:'d10',name:'Entretien & Nettoyage (exemple)',cat:'net',spec:['Maisons','Bureaux','Après travaux'],desc:'Exemple de profil : nettoyage de maisons et de bureaux, remise en état après travaux.',city:"N'Djaména",quartier:'Chagoua',phone:'00000010',hours:'',price:'',popular:false}
];

/* ---------- Utilitaires ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')};
var catOf=function(id){return CATS.find(function(c){return c.id===id})||CATS[0]};
var icon=function(id){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+catOf(id).ico+'</svg>'};
var fmtPhone=function(p){return '+235 '+p.replace(/(\d{2})(?=\d)/g,'$1 ').trim()};
var intl=function(p){return '235'+p};
var normPhone=function(v){var d=String(v||'').replace(/\D/g,'');if(d.length===11&&d.indexOf('235')===0)d=d.slice(3);return d.length===8?d:''};
var S={q:'',cat:'',city:'',quartier:'',reportId:'',regPhoto:''};
var WA_MSG='Bonjour, j\'ai trouvé votre profil sur ALHAKIM SERVICES. Je souhaite me renseigner sur vos services.';
function store(key,val){try{if(val===undefined){var r=localStorage.getItem(key);return r?JSON.parse(r):null}localStorage.setItem(key,JSON.stringify(val));return true}catch(e){return false}}
var mem={pending:[],messages:[]};
function getList(k){var v=store('alhakim.'+k);return Array.isArray(v)?v:mem[k]}
function addTo(k,item){var l=getList(k).concat([item]);mem[k]=l;return store('alhakim.'+k,l)}
function quartiersFor(city){
  var set=(PLACES[city]||[]).slice();
  DEMO.forEach(function(p){if(p.city===city&&set.indexOf(p.quartier)<0)set.push(p.quartier)});
  return set;
}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function optsCities(sel){return '<option value="">Toutes les villes</option>'+Object.keys(PLACES).map(function(c){return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'}).join('')}
function optsQuartiers(city,sel){
  if(!city)return '<option value="">Choisir d\'abord une ville</option>';
  return '<option value="">Tous les quartiers</option>'+quartiersFor(city).map(function(q){return '<option'+(q===sel?' selected':'')+'>'+esc(q)+'</option>'}).join('');
}
function optsCats(sel,all){return (all?'<option value="">Tous les métiers</option>':'<option value="">Choisir un métier</option>')+CATS.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.label)+'</option>'}).join('')}

function search(){
  var q=norm(S.q).trim();
  return DEMO.filter(function(p){
    if(S.cat&&p.cat!==S.cat)return false;
    if(S.city&&p.city!==S.city)return false;
    if(S.quartier&&p.quartier!==S.quartier)return false;
    if(!q)return true;
    var hay=norm([p.name,catOf(p.cat).label,p.spec.join(' '),p.desc,p.city,p.quartier].join(' '));
    return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0});
  });
}
function cardHtml(p){
  return '<li><a class="card" href="#pro-'+p.id+'"><span class="av">'+(p.photo?'<img src="'+p.photo+'" alt="" loading="lazy">':icon(p.cat))+'</span><span class="body">'
   +'<span class="demo">Démonstration</span>'
   +'<span class="nm">'+esc(p.name)+'</span>'
   +'<span class="small muted">'+esc(catOf(p.cat).label)+' · '+esc(p.quartier)+', '+esc(p.city)+'</span>'
   +'<span class="tags">'+p.spec.slice(0,3).map(function(s){return '<span class="tag">'+esc(s)+'</span>'}).join('')+'</span>'
   +'</span></a></li>';
}

/* ---------- Pages ---------- */
function pageHome(){
  return ''
  +'<div class="hero">'
  +'  <div class="top">'+logo()+'<span class="brand">ALHAKIM SERVICES</span></div>'
  +'  <h1>La confiance, au service de tous.</h1>'
  +'  <p class="sub">Trouvez un professionnel près de chez vous et contactez-le directement par téléphone ou WhatsApp.</p>'
  +'  <form id="homeSearch" class="field" style="gap:10px" novalidate>'
  +'    <label for="hq" class="sr" style="position:absolute;left:-9999px">Quel professionnel recherchez-vous ?</label>'
  +'    <input id="hq" type="search" placeholder="Quel professionnel recherchez-vous ?" autocomplete="off" value="'+esc(S.q)+'">'
  +'    <div class="row2">'
  +'      <select id="hcity" aria-label="Ville" data-geo="home">'+optsCities(S.city)+'</select>'
  +'      <select id="hquart" aria-label="Quartier" '+(S.city?'':'disabled')+'>'+optsQuartiers(S.city,S.quartier)+'</select>'
  +'    </div>'
  +'    <button class="btn btn-light btn-block" type="submit">Rechercher</button>'
  +'  </form>'
  +'</div>'
  +'<section aria-labelledby="hcats" style="display:flex;flex-direction:column;gap:12px"><h2 id="hcats">Catégories de services</h2><div class="cats">'
  +CATS.map(function(c){return '<button class="cat" type="button" data-cat="'+c.id+'"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+c.ico+'</svg></span><span class="t">'+esc(c.label)+'</span></button>'}).join('')
  +'</div></section>'
  +'<section aria-labelledby="hpop" style="display:flex;flex-direction:column;gap:12px"><div class="sec-head"><h2 id="hpop">Professionnels populaires</h2><a href="#recherche" class="small" data-all>Tout voir</a></div>'
  +'<p class="notice small">Ces profils sont des exemples de démonstration. Ils ne correspondent à aucun vrai professionnel.</p>'
  +'<ul class="list">'+DEMO.filter(function(p){return p.popular}).map(cardHtml).join('')+'</ul></section>'
  +'<section class="panel"><h2>Vous êtes professionnel ?</h2><p class="muted">Inscrivez votre activité pour être trouvé par les habitants de votre quartier. Votre profil est vérifié avant publication.</p><a class="btn btn-primary" href="#inscription">Inscrire mon activité</a></section>';
}
function logo(){return '<svg class="logo" viewBox="0 0 40 40" role="img" aria-label="Logo ALHAKIM SERVICES"><rect width="40" height="40" rx="11" fill="#fff"/><path d="M12 29 20 10l8 19" fill="none" stroke="#0B2A5B" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 23h9" stroke="#0B2A5B" stroke-width="3.2" stroke-linecap="round"/><circle cx="31" cy="11" r="3.2" fill="#12813B"/></svg>'}

function pageSearch(){
  return '<h1 tabindex="-1" id="h1">Rechercher un professionnel</h1>'
  +'<form id="sform" class="panel" novalidate>'
  +'<div class="field"><label for="sq">Nom, métier ou spécialité</label><input id="sq" type="search" placeholder="Ex. écran, fuite, couture" autocomplete="off" value="'+esc(S.q)+'"></div>'
  +'<div class="field"><label for="scat">Catégorie</label><select id="scat">'+optsCats(S.cat,true)+'</select></div>'
  +'<div class="row2"><div class="field"><label for="scity">Ville</label><select id="scity" data-geo="s">'+optsCities(S.city)+'</select></div>'
  +'<div class="field"><label for="squart">Quartier</label><select id="squart" '+(S.city?'':'disabled')+'>'+optsQuartiers(S.city,S.quartier)+'</select></div></div>'
  +'<button type="button" class="btn btn-ghost" data-reset>Effacer les filtres</button>'
  +'</form>'
  +'<div id="results" aria-live="polite" style="display:flex;flex-direction:column;gap:12px"></div>';
}
function renderResults(){
  var r=search(),el=$('#results');if(!el)return;
  if(!r.length){
    el.innerHTML='<div class="empty"><h2>Aucun résultat</h2><p class="muted">Aucun professionnel ne correspond à votre recherche. Essayez un autre mot, une autre ville, ou effacez les filtres.</p><button class="btn btn-primary" type="button" data-reset>Effacer les filtres</button></div>';
    return;
  }
  el.innerHTML='<p class="small muted"><b>'+r.length+'</b> résultat'+(r.length>1?'s':'')+' · profils de démonstration</p><ul class="list">'+r.map(cardHtml).join('')+'</ul>';
}

function pagePro(id){
  var p=DEMO.find(function(x){return x.id===id});
  if(!p)return '<a class="back" href="#recherche">‹ Retour aux résultats</a><div class="empty"><h1>Profil introuvable</h1><a class="btn btn-primary" href="#recherche">Voir les professionnels</a></div>';
  var wa='https://wa.me/'+intl(p.phone)+'?text='+encodeURIComponent(WA_MSG);
  return '<a class="back" href="#recherche">‹ Retour aux résultats</a>'
  +'<div class="pf-head"><div class="pf-av">'+(p.photo?'<img src="'+p.photo+'" alt="Photo de '+esc(p.name)+'">':icon(p.cat))+'</div>'
  +'<div style="min-width:0;display:flex;flex-direction:column;gap:6px"><span class="demo">Démonstration</span><h1 id="h1" tabindex="-1" style="font-size:1.4rem;overflow-wrap:anywhere">'+esc(p.name)+'</h1><p class="muted small">'+esc(catOf(p.cat).label)+'</p></div></div>'
  +'<p class="notice small">Profil d\'exemple. Le numéro ci-dessous est fictif : le bouton WhatsApp et l\'appel ne joindront personne.</p>'
  +'<div class="panel"><div class="numbox"><div><div class="small muted">Téléphone</div><b>'+fmtPhone(p.phone)+'</b></div><button class="btn btn-ghost" type="button" data-copy="'+fmtPhone(p.phone)+'">Copier</button></div>'
  +'<div style="display:grid;gap:10px"><a class="btn btn-primary" href="tel:+'+intl(p.phone)+'">Appeler</a>'
  +'<a class="btn btn-wa" href="'+wa+'" target="_blank" rel="noopener">Contacter sur WhatsApp</a></div></div>'
  +'<div class="panel"><h2>Services proposés</h2><p>'+esc(p.desc)+'</p><div class="tags">'+p.spec.map(function(s){return '<span class="tag">'+esc(s)+'</span>'}).join('')+'</div></div>'
  +'<div class="panel"><dl class="dl"><dt>Ville</dt><dd>'+esc(p.city)+'</dd><dt>Quartier</dt><dd>'+esc(p.quartier)+'</dd>'
  +(p.hours?'<dt>Horaires</dt><dd>'+esc(p.hours)+'</dd>':'')
  +(p.price?'<dt>Prix indicatif</dt><dd>'+esc(p.price)+'</dd>':'')
  +'</dl></div>'
  +'<div class="panel"><h2>Avis clients</h2><p class="muted">Aucun avis pour le moment. Seuls des avis authentiques seront affichés ici.</p></div>'
  +'<button class="btn btn-ghost btn-block" type="button" data-report="'+p.id+'">Signaler ce profil</button>';
}

function pageRegister(){
  var pend=getList('pending');
  return '<h1 id="h1" tabindex="-1">Inscrire mon activité</h1>'
  +'<p class="muted">Remplissez ce formulaire. Seules les informations utiles à votre profil sont demandées. Aucun paiement n\'est demandé.</p>'
  +'<div id="regDone"></div>'
  +'<form id="regForm" class="panel" novalidate>'
  +f('rname','Nom du professionnel ou de l\'entreprise','<input id="rname" type="text" autocomplete="organization" maxlength="80">')
  +f('rcat','Catégorie de métier','<select id="rcat">'+optsCats('',false)+'</select>')
  +f('rdesc','Description des services','<textarea id="rdesc" maxlength="400" placeholder="Décrivez vos services en quelques phrases."></textarea>')
  +'<div class="row2">'+f('rcity','Ville','<input id="rcity" type="text" list="cityList" autocomplete="off" maxlength="40"><datalist id="cityList">'+Object.keys(PLACES).map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist>')
  +f('rquart','Quartier','<input id="rquart" type="text" list="quartList" autocomplete="off" maxlength="40"><datalist id="quartList"></datalist>')+'</div>'
  +f('rphone','Numéro de téléphone (Tchad, 8 chiffres)','<input id="rphone" type="tel" inputmode="tel" placeholder="Ex. 66 00 00 00" autocomplete="tel-national">')
  +'<label class="check"><input id="rsame" type="checkbox" checked><span>Ce numéro est aussi mon numéro WhatsApp</span></label>'
  +'<div id="rwaWrap" hidden>'+f('rwa','Numéro WhatsApp','<input id="rwa" type="tel" inputmode="tel" placeholder="Ex. 66 00 00 00">')+'</div>'
  +'<div class="field"><label for="rphoto">Photo de profil ou de travaux <span class="opt">(facultatif)</span></label><input id="rphoto" type="file" accept="image/*"><div id="rprev"></div></div>'
  +'<div class="field"><label for="rhours">Horaires <span class="opt">(facultatif)</span></label><input id="rhours" type="text" placeholder="Ex. Lun–Sam · 8 h – 18 h" maxlength="60"></div>'
  +'<div class="field"><label for="rprice">Prix indicatif en FCFA <span class="opt">(facultatif)</span></label><input id="rprice" type="text" placeholder="Ex. Déplacement dès 5 000 FCFA" maxlength="80"></div>'
  +'<div class="field"><label class="check"><input id="rok" type="checkbox"><span>J\'accepte que ces informations soient affichées publiquement une fois mon profil validé.</span></label><div class="err" id="e-rok" role="alert"></div></div>'
  +'<button class="btn btn-primary btn-block" type="submit">Envoyer pour validation</button>'
  +'</form>'
  +(pend.length?'<section class="panel"><h2>Mes demandes en attente</h2><p class="small muted">Visibles uniquement sur cet appareil.</p><ul class="list">'+pend.map(function(p){return '<li class="card"><span class="av">'+(p.photo?'<img src="'+p.photo+'" alt="">':icon(p.cat))+'</span><span class="body"><span class="demo">En attente de validation</span><span class="nm">'+esc(p.name)+'</span><span class="small muted">'+esc(catOf(p.cat).label)+' · '+esc(p.quartier)+', '+esc(p.city)+'</span></span></li>'}).join('')+'</ul></section>':'');
}
function f(id,label,control){return '<div class="field"><label for="'+id+'">'+label+'</label>'+control+'<div class="err" id="e-'+id+'" role="alert"></div></div>'}

function pageAbout(){
  return '<h1 id="h1" tabindex="-1">À propos</h1>'
  +'<div class="panel"><div class="top"><span style="background:var(--hero);border-radius:12px;padding:0;display:inline-flex">'+logo()+'</span><span class="brand">ALHAKIM SERVICES</span></div>'
  +'<p><b>La confiance, au service de tous.</b> ALHAKIM SERVICES aide les habitants du Tchad à trouver un professionnel de proximité et à le contacter directement par téléphone ou WhatsApp.</p></div>'
  +'<div class="panel"><h2>Comment ça marche</h2><p>Choisissez un métier, une ville et un quartier. Ouvrez un profil, puis appelez ou écrivez sur WhatsApp. Aucun compte n\'est nécessaire et il n\'y a rien à payer.</p></div>'
  +'<div class="panel"><h2>Nos engagements</h2><p>Chaque nouveau profil est validé avant publication. Aucun badge « vérifié » n\'est affiché sans vérification réelle. Les avis clients ne sont affichés que s\'ils sont authentiques. Nous demandons le minimum de données personnelles.</p></div>'
  +'<div class="notice"><b>Version de démonstration.</b> Les 10 profils affichés sont des exemples. Aucune base de données en ligne n\'est connectée : les inscriptions et messages sont gardés sur votre appareil seulement et ne sont pas publiés. Le service est prévu d\'abord pour le Tchad, avec une extension possible à d\'autres pays africains.</div>';
}
function pageContact(){
  var opts='<option value="">Choisir un profil</option>'+DEMO.map(function(p){return '<option value="'+p.id+'"'+(p.id===S.reportId?' selected':'')+'>'+esc(p.name)+'</option>'}).join('');
  return '<h1 id="h1" tabindex="-1">Contact et signalement</h1>'
  +'<p class="muted">Posez une question, faites une suggestion ou signalez un profil douteux.</p>'
  +'<div id="cDone"></div>'
  +'<form id="cForm" class="panel" novalidate>'
  +f('ctype','Votre demande','<select id="ctype"><option value="question">Question ou suggestion</option><option value="report"'+(S.reportId?' selected':'')+'>Signaler un profil</option></select>')
  +'<div id="cprofWrap" '+(S.reportId?'':'hidden')+'>'+f('cprof','Profil concerné','<select id="cprof">'+opts+'</select>')+'</div>'
  +f('cmsg','Message','<textarea id="cmsg" maxlength="600" placeholder="Expliquez en quelques phrases."></textarea>')
  +'<div class="field"><label for="ccontact">Votre numéro ou e-mail <span class="opt">(facultatif)</span></label><input id="ccontact" type="text" maxlength="80" autocomplete="off"></div>'
  +'<button class="btn btn-primary btn-block" type="submit">Envoyer</button></form>';
}

/* ---------- Navigation ---------- */
var NAV=[['','Accueil','<path d="M3 11 12 3l9 8M5 10v10h5v-6h4v6h5V10"/>'],['recherche','Recherche','<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'],['inscription','Inscrire','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0M18 4v4M16 6h4"/>'],['contact','Contact','<path d="M4 5h16v11H9l-5 4z"/>'],['a-propos','À propos','<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.1"/>']];
function route(){
  var h=location.hash.replace(/^#/,''),name=h,view='';
  if(h.indexOf('pro-')===0){name='recherche';view=pagePro(h.slice(4))}
  else if(h==='recherche')view=pageSearch();
  else if(h==='inscription')view=pageRegister();
  else if(h==='a-propos')view=pageAbout();
  else if(h==='contact')view=pageContact();
  else{name='';view=pageHome()}
  $('#view').innerHTML=view;
  $('#nav').innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'"'+(n[0]===name?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+n[2]+'</svg><span>'+n[1]+'</span></a>'}).join('');
  if(h==='recherche')renderResults();
  if(h!=='contact')S.reportId='';
  window.scrollTo(0,0);
  var t=$('#h1');if(t&&h)t.focus({preventScroll:true});
}
function go(h){if(location.hash==='#'+h)route();else location.hash=h}
window.addEventListener('hashchange',route);

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-cat],[data-reset],[data-copy],[data-report],[data-all]');if(!t)return;
  if(t.hasAttribute('data-cat')){S.cat=t.getAttribute('data-cat');S.q='';S.city='';S.quartier='';go('recherche')}
  else if(t.hasAttribute('data-all')){S.cat='';S.q='';S.city='';S.quartier=''}
  else if(t.hasAttribute('data-reset')){S.q='';S.cat='';S.city='';S.quartier='';route()}
  else if(t.hasAttribute('data-report')){S.reportId=t.getAttribute('data-report');go('contact')}
  else if(t.hasAttribute('data-copy')){
    var txt=t.getAttribute('data-copy');
    try{navigator.clipboard.writeText(txt).then(function(){toast('Numéro copié')},function(){toast('Copie impossible : sélectionnez le numéro')})}catch(err){toast('Copie impossible : sélectionnez le numéro')}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='hcity'||t.id==='scity'){
    var q=$(t.id==='hcity'?'#hquart':'#squart');S.city=t.value;S.quartier='';
    q.disabled=!t.value;q.innerHTML=optsQuartiers(t.value,'');
    if(t.id==='scity')renderResults();
  }
  if(t.id==='scat'){S.cat=t.value;renderResults()}
  if(t.id==='squart'){S.quartier=t.value;renderResults()}
  if(t.id==='hquart')S.quartier=t.value;
  if(t.id==='rsame')$('#rwaWrap').hidden=t.checked;
  if(t.id==='ctype')$('#cprofWrap').hidden=t.value!=='report';
  if(t.id==='rphoto')readPhoto(t.files&&t.files[0]);
});
document.addEventListener('input',function(e){
  if(e.target.id==='sq'){S.q=e.target.value;renderResults()}
  if(e.target.id==='rcity'){var l=$('#quartList');if(l)l.innerHTML=quartiersFor(e.target.value.trim()).map(function(q){return '<option value="'+esc(q)+'">'}).join('')}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(id==='homeSearch'){S.q=$('#hq').value;S.city=$('#hcity').value;S.quartier=$('#hquart').value;S.cat='';go('recherche')}
  if(id==='regForm')submitReg();
  if(id==='cForm')submitContact();
  if(id==='sform')renderResults();
});
function readPhoto(file){
  S.regPhoto='';var prev=$('#rprev');prev.innerHTML='';if(!file)return;
  if(!/^image\//.test(file.type)){toast('Choisissez une image');return}
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
    var m=480,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    S.regPhoto=c.toDataURL('image/jpeg',0.7);prev.innerHTML='<img class="preview" alt="Aperçu de la photo" src="'+S.regPhoto+'">';
  };img.onerror=function(){toast('Image illisible')};img.src=fr.result};
  fr.readAsDataURL(file);
}
function setErr(id,msg){var el=$('#e-'+id),inp=$('#'+id);if(el)el.textContent=msg||'';if(inp&&inp.type!=='checkbox'){if(msg)inp.setAttribute('aria-invalid','true');else inp.removeAttribute('aria-invalid')}return !msg}
function submitReg(){
  var v=function(id){return $('#'+id).value.trim()};
  var phone=normPhone(v('rphone')),same=$('#rsame').checked,wa=same?phone:normPhone(v('rwa'));
  var ok=true,first='';
  var chk=[['rname',v('rname').length>=2,'Indiquez un nom.'],['rcat',!!v('rcat'),'Choisissez une catégorie.'],['rdesc',v('rdesc').length>=15,'Décrivez vos services (15 caractères minimum).'],['rcity',!!v('rcity'),'Indiquez votre ville.'],['rquart',!!v('rquart'),'Indiquez votre quartier.'],['rphone',!!phone,'Saisissez un numéro à 8 chiffres.'],['rok',$('#rok').checked,'Vous devez accepter pour continuer.']];
  if(!same)chk.push(['rwa',!!wa,'Saisissez un numéro WhatsApp à 8 chiffres.']);
  chk.forEach(function(c){var good=setErr(c[0],c[1]?'':c[2]);if(!good&&ok){ok=false;first=c[0]}});
  if(!ok){var el=$('#'+first);if(el)el.focus();return}
  var rec={id:'p'+Date.now(),name:v('rname'),cat:v('rcat'),desc:v('rdesc'),city:v('rcity'),quartier:v('rquart'),phone:phone,wa:wa,hours:v('rhours'),price:v('rprice'),photo:S.regPhoto,status:'pending',date:new Date().toISOString()};
  var saved=addTo('pending',rec);
  S.regPhoto='';
  route();
  $('#regDone').innerHTML='<div class="ok" role="status"><b>Merci, votre profil est en attente de validation.</b><br>Il n\'est pas encore visible par le public. '+(saved?'Cette version de démonstration garde votre demande sur cet appareil seulement.':'Le stockage de cet appareil est indisponible : la demande n\'est conservée que tant que cette page reste ouverte.')+' Aucune base de données en ligne n\'est connectée.</div>';
  $('#regDone').scrollIntoView({block:'center'});
}
function submitContact(){
  var type=$('#ctype').value,msg=$('#cmsg').value.trim(),prof=$('#cprof').value;
  var ok=setErr('cmsg',msg.length>=10?'':'Écrivez au moins 10 caractères.');
  if(type==='report')ok=setErr('cprof',prof?'':'Choisissez le profil concerné.')&&ok;
  if(!ok){$(!msg||msg.length<10?'#cmsg':'#cprof').focus();return}
  var saved=addTo('messages',{type:type,profile:type==='report'?prof:'',message:msg,contact:$('#ccontact').value.trim(),date:new Date().toISOString()});
  S.reportId='';route();
  $('#cDone').innerHTML='<div class="ok" role="status"><b>Message enregistré.</b><br>Dans cette version de démonstration, il n\'est pas encore transmis à l\'équipe : '+(saved?'il est gardé sur cet appareil.':'il n\'est conservé que tant que la page reste ouverte.')+'</div>';
}
route();
</script>
</body>
</html>
